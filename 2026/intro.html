<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Briefing · Happy Duck Investigation</title>
    <!-- Apply saved dark-mode preference before first paint, so
         there's no light->dark flash on load. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("hd-theme") === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="page-centered">
    <!-- Case tag -->
    <p class="case-tag">CASE #2026</p>

    <main class="intro" role="main">
      <!-- Tapping the duck toggles dark mode, same as on the login page. -->
      <button
        id="theme-toggle"
        class="logo-btn"
        type="button"
        aria-label="Toggle dark mode"
        aria-pressed="false"
      >
        <img
          id="logo"
          class="logo logo--float"
          src="assets/logo.png"
          alt="Happy Duck logo"
        />
      </button>

      <h1 class="intro__title">
        Two cases are open.<br />The clues are around the apartment.
      </h1>
      <p class="intro__text">
        Find the postcards and name each case. Guess right before the clues run
        out and you close it early.
      </p>

      <!-- Plain link styled as a button — no JS needed to navigate -->
      <a href="dashboard.html" class="btn btn--primary intro__cta">
        <span class="btn__label">Start Investigation</span>
        <span class="btn__arrow" aria-hidden="true">→</span>
      </a>
    </main>

    <script src="js/shared.js"></script>
    <script>
      initTheme(); // dark mode toggle lives in shared.js
    </script>
    <!-- Guard: bounce to login if there's no session. Needs `vercel
         dev` (the /api functions) — comment this line out to
         preview the page with a plain static server. -->
    <script src="js/guard.js"></script>
  </body>
</html>
