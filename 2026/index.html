<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Happy Duck Investigation</title>
    <meta name="description" content="A confidential birthday mystery." />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/favicon.png" />

    <!-- Google Fonts: Fraunces (titles), Inter (UI), JetBrains Mono (coords) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Our styles -->
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="page-centered">
    <!-- Soft ambient background blobs (pure decoration) -->
    <div class="blob blob--green"></div>
    <div class="blob blob--olive"></div>

    <main class="card login-card" role="main">
      <!-- Logo + wordmark. -->
      <div class="logo-block">
        <img id="logo" class="logo" src="assets/logo.png" alt="Happy Duck logo" />
        <div class="wordmark">
          <span class="wordmark__title">HAPPY DUCK</span>
          <span class="wordmark__sub">INVESTIGATION</span>
        </div>
      </div>

      <form id="login-form" class="login-form" novalidate>
        <label for="password" class="field-label">Enter the secret code</label>

        <div class="input-wrap">
          <span class="input-wrap__icon" aria-hidden="true">#</span>
          <input
            id="password"
            name="password"
            type="password"
            inputmode="numeric"
            autocomplete="off"
            placeholder="••••••"
            class="input"
            required
          />
          <button
            type="button"
            id="toggle-pw"
            class="input-wrap__toggle"
            aria-label="Show or hide code"
          >
            👀
          </button>
        </div>

        <!-- Error message, hidden until needed -->
        <p id="error" class="error-text" role="alert" hidden>
          Quack! Wrong code.
        </p>

        <button type="submit" id="submit" class="btn btn--primary btn--block">
          <span class="btn__label">Enter</span>
          <span class="btn__arrow" aria-hidden="true">→</span>
        </button>

        <p class="hint">The duck knows who you are.</p>
      </form>
    </main>

    <p class="footer-tag">CASE #2026 · CONFIDENTIAL</p>

    <!-- Shared helpers first, then this page's script -->
    <script src="js/shared.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
