<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Final · Happy Duck Investigation</title>
    <!-- Apply saved dark-mode preference before first paint, so
         there's no light->dark flash on load. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("hd-theme") === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="page-centered">
    <div
      class="blob blob--green"
      style="left: 50%; top: -90px; transform: translateX(-50%)"
    ></div>

    <!-- Locked state: not all clues found yet -->
    <main id="locked-view" class="final-locked" role="main" hidden>
      <!-- Tapping the duck toggles dark mode, same as login/intro. -->
      <button
        class="logo-btn"
        type="button"
        data-theme-toggle
        aria-label="Toggle dark mode"
        aria-pressed="false"
      >
        <img
          id="logo-locked"
          class="logo"
          src="assets/logo.png"
          alt=""
          aria-hidden="true"
        />
      </button>
      <div class="pill"><span>🔒</span> The cases aren't closed yet</div>
      <h1 class="final-locked__title">Keep investigating</h1>
      <p class="final-locked__text">
        You've found <span id="locked-found">0</span> of
        <span id="locked-total">6</span> clues. Close both cases — by finding
        every postcard, or by naming them — to open the file.
      </p>
      <div class="locked-words" id="locked-words"></div>
      <a href="dashboard.html" class="btn btn--ghost final-locked__back"
        >← Back to investigation</a
      >
    </main>

    <!-- Solved state -->
    <main id="solved-view" class="card final-card" role="main" hidden>
      <!-- Tapping the duck toggles dark mode, same as login/intro. -->
      <button
        class="logo-btn"
        type="button"
        data-theme-toggle
        aria-label="Toggle dark mode"
        aria-pressed="false"
      >
        <img
          id="logo-solved"
          class="logo logo--float"
          src="assets/logo.png"
          alt=""
          aria-hidden="true"
        />
      </button>

      <h1 class="final__title">CASE CLOSED</h1>
      <p class="final__subtitle" id="final-subtitle">Both files are yours.</p>

      <!-- Reveal button (before) -->
      <button id="reveal-btn" class="btn btn--primary btn--block final__reveal">
        Open the File
      </button>

      <!-- The two workshops (after reveal) — built by JS from config -->
      <div id="destinations" class="destinations" hidden></div>

      <a href="dashboard.html" class="final__home">← Back to home</a>
    </main>

    <script src="js/shared.js"></script>
    <script src="js/config.js"></script>
    <script src="js/state.js"></script>
    <!-- Guard: bounce to login if there's no session. Needs `vercel
         dev` (the /api functions) — comment this line out to
         preview the page with a plain static server. -->
    <script src="js/guard.js"></script>
    <script src="js/final.js"></script>
  </body>
</html>
